server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-${spring.profiles.active}-private.yml
  data:
    redis:
      host: ${app.redis.host}
      port: ${app.redis.port}
      password: ${app.redis.password:}
      database: ${app.redis.database:0}
      timeout: ${app.redis.timeout:5s}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${app.nacos.server-addr:127.0.0.1:8848}
        namespace: ${app.nacos.namespace:}
        group: ${app.nacos.group:DEFAULT_GROUP}
      config:
        enabled: false
        server-addr: ${app.nacos.server-addr:127.0.0.1:8848}
        namespace: ${app.nacos.namespace:}
        group: ${app.nacos.group:DEFAULT_GROUP}
        file-extension: yaml
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/user/**
              filters:
                - StripPrefix=2
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/product/list,/api/v1/product/hot,/api/v1/product/*,/api/v1/product/category/**,/api/v1/product/brand/**
              filters:
                - StripPrefix=2
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - StripPrefix=2
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/order/**
              filters:
                - StripPrefix=2
            - id: stock-service
              uri: lb://stock-service
              predicates:
                - Path=/api/v1/stock/**
              filters:
                - StripPrefix=2
            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/api/v1/coupon/**
              filters:
                - StripPrefix=2

app:
  security:
    jwt:
      secret: change-this-jwt-secret-to-a-secure-value-2026
      issuer: sparkle-shop
      expiration-seconds: 7200
    gateway:
      whitelist:
        - /api/v1/user/register
        - /api/v1/user/login
        - /api/v1/product/list
        - /api/v1/product/hot
        - /api/v1/product/*
        - /api/v1/product/category/**
        - /api/v1/product/brand/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
